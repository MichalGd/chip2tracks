name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q scripts common tests
      - name: Run regression suite
        run: bash tests/run_tests.sh
      - name: Verify source baseline manifest format
        run: awk 'NF != 2 || length($1) != 64 {exit 1}' provenance/cutnrun2tracks_v0.2.8.sha256
